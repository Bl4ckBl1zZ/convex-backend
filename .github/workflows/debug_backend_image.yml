name: Debug Backend Image

on:
  push:
    branches:
      - "debug/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/bl4ckbl1zz/convex-backend

jobs:
  build:
    name: Build unstripped amd64 backend
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reclaim hosted-runner build space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish unstripped backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:debug-${{ github.sha }}-amd64
          build-args: |
            CARGO_BUILD_JOBS=2
            debug=1
            VERGEN_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=convex-backend-amd64
          cache-to: "type=gha,mode=max,scope=convex-backend-debug-amd64,ignore-error=true"
          provenance: false
