name: Build Convex Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build Convex Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Install Clippy for the pinned nightly toolchain
        run: rustup component add clippy

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM install globals
        run: npm ci --prefix scripts

      - name: Build JS required by Isolate
        run: |
          just install-js
          just turbo run build --filter=component-tests... --filter=convex... --filter=system-udfs... --filter=udf-runtime... --filter=udf-tests...

      - name: Check backend integration crates
        run: cargo check --locked -p local_backend -p node_executor

      - name: Lint fork-modified crates
        run: >-
          cargo clippy --locked -p local_backend -p node_executor --all-targets
          -- -D warnings

      - name: Test the local Node executor pool
        run: cargo test --locked -p node_executor --lib
