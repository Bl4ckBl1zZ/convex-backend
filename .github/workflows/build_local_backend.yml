name: Build Convex Backend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    name: Build Convex Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          r2-access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Check Cargo.lock up-to-date
        run: cargo update -w --locked

      - name: Install mise tools
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: NPM install globals
        run: npm ci --prefix scripts

      - name: Build JS required by Isolate
        run: |
          just install-js
          just turbo run build --filter=component-tests... --filter=convex... --filter=system-udfs... --filter=udf-runtime... --filter=udf-tests...

      - name: Check backend integration crates
        run: >-
          cargo check -p local_backend -p node_executor -p application -p
          function_runner -p database -p indexing -p isolate -p
          search_index_workers -p storage

      - name: Lint fork-modified libraries
        run: >-
          cargo clippy -p application -p database -p function_runner -p indexing
          -p isolate -p search_index_workers -p storage --lib -- -D warnings

      - name: Test vertical-scaling defaults
        run: cargo test -p common vertical_scaling --lib

      - name: Test persistence connection headroom
        run: cargo test -p common commit_persistence --lib

      - name: Test shared isolate CPU capacity
        run: cargo test -p isolate cloned_limiters_share_cpu_capacity --lib

      - name: Test state-only index OCC behavior
        run: >-
          cargo test -p indexing
          state_only_index_update_does_not_invalidate_virtual_definition_index
          --lib
