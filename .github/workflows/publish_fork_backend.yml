# Fork-only. Builds the backend image that Dokploy deploys and publishes it to
# GHCR. This is the only workflow that runs on pushes to `main`; see
# .github/UPSTREAM_SYNC.md ("CI and image publishing").
name: Publish Fork Backend Image

on:
  push:
    branches:
      - main
    # Merges that change nothing the image is built from. Keep this list to
    # fork-owned paths: everything else, including any new upstream build
    # input, still publishes.
    paths-ignore:
      - ".github/UPSTREAM_SYNC.md"
      - ".github/fork_workflows.sh"
      - ".github/workflows/build_local_backend.yml"
      - ".github/workflows/prettier.yml"
      - "self-hosted/advanced/**"
      - "self-hosted/docker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bl4ckbl1zz/convex-backend

jobs:
  build:
    name: Build and publish ${{ matrix.platform }} backend
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production (Proxmox) is amd64.
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          # RestoreCord's MicroApi Convex stack runs this image on an arm64 host.
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show runner resources
        shell: bash
        run: |
          nproc
          free -g
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The runner is discarded after the job; removing the builder only
          # adds minutes.
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read commit timestamp
        id: commit
        shell: bash
        run:
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      # No layer cache: cargo writes its output to a BuildKit cache mount,
      # which a layer cache does not save, so a cache hit only skipped
      # `cargo chef cook` and left the final build to compile every
      # dependency. Exporting the cache cost 5-22 minutes per run.
      - name: Build and publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.commit.outputs.timestamp }}
            org.opencontainers.image.description=High-throughput self-hosted Convex backend
          # Hosted runners have 4 vCPUs and 16 GB of memory.
          build-args: |
            CARGO_BUILD_JOBS=4
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ steps.commit.outputs.timestamp }}
          provenance: false

  publish:
    name: Publish multi-platform backend manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          cleanup: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        id: manifest
        shell: bash
        run: |
          tags=(--tag "${IMAGE_NAME}:sha-${GITHUB_SHA}")
          # A manual run on another branch must not move the floating tags.
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            tags+=(--tag "${IMAGE_NAME}:latest" --tag "${IMAGE_NAME}:main")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          digest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" |
              awk '$1 == "Digest:" { print $2; exit }'
          )"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write pull information
        shell: bash
        run: |
          {
            echo "### Published backend image"
            echo
            echo "\`${IMAGE_NAME}:sha-${GITHUB_SHA}@${{ steps.manifest.outputs.digest }}\`"
            echo
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "Also tagged \`latest\` and \`main\`."
              echo
            fi
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Both Dokploy stacks run `latest` with `pull_policy: always`, so a redeploy
  # takes the image just published. Dev goes first and must answer with the new
  # commit on `/version` before production is redeployed. The URLs are secrets:
  # each webhook deploys only its own stack, and none of them is named here.
  deploy:
    name: Deploy to Dev, then production
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Deploy and verify
        shell: bash
        env:
          DEV_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEV_DEPLOY_WEBHOOK }}
          DEV_CONVEX_URL: ${{ secrets.DEV_CONVEX_URL }}
          PROD_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_PROD_DEPLOY_WEBHOOK }}
          PROD_CONVEX_URL: ${{ secrets.PROD_CONVEX_URL }}
          PROD_APP_HEALTH_URL: ${{ secrets.PROD_APP_HEALTH_URL }}
        run: |
          set -euo pipefail
          for name in DEV_DEPLOY_WEBHOOK DEV_CONVEX_URL PROD_DEPLOY_WEBHOOK PROD_CONVEX_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is not set; nothing was deployed."
              exit 1
            fi
          done

          # Dokploy's compose webhook takes a GitHub push payload; both stacks
          # deploy on `main` with no watch paths.
          trigger() {
            local stage=$1 webhook=$2 payload status
            payload=$(jq -n --arg sha "$GITHUB_SHA" \
              '{ref: "refs/heads/main", after: $sha, commits: [],
                head_commit: {id: $sha, message: ("Backend image sha-" + $sha[0:12])}}')
            status=$(curl -sS -o /tmp/response -w '%{http_code}' --max-time 60 -X POST \
              -H 'content-type: application/json' -H 'x-github-event: push' \
              --data "$payload" "$webhook")
            echo "$stage webhook: HTTP $status $(cat /tmp/response)"
            # Dokploy answers 301 when it skips a deploy, so only 200 counts.
            [ "$status" = 200 ] || { echo "::error::$stage was not deployed (HTTP $status)."; exit 1; }
          }

          # The backend answers /version with its image's commit. It must keep
          # answering it for a minute, so a crash after migrating fails here.
          await_version() {
            local stage=$1 url=$2 deadline=$((SECONDS + 1500)) streak=0 version
            while [ $SECONDS -lt $deadline ]; do
              version=$(curl -fsS --max-time 10 "${url%/}/version" 2>/dev/null || true)
              if [ "$version" = "$GITHUB_SHA" ]; then
                streak=$((streak + 1))
                [ $streak -ge 6 ] && { echo "$stage runs ${GITHUB_SHA:0:12}."; return 0; }
              else
                streak=0
              fi
              sleep 10
            done
            echo "::error::$stage did not come up on ${GITHUB_SHA:0:12} within 25 minutes (last /version: ${version:-no answer})."
            exit 1
          }

          trigger Dev "$DEV_DEPLOY_WEBHOOK"
          await_version Dev "$DEV_CONVEX_URL"
          trigger Production "$PROD_DEPLOY_WEBHOOK"
          await_version Production "$PROD_CONVEX_URL"

          if [ -n "$PROD_APP_HEALTH_URL" ]; then
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 "$PROD_APP_HEALTH_URL" | jq -e '.status == "ok" and (.convex.ok // true)' >/dev/null; then
                echo "Production app health: ok."
                break
              fi
              [ $attempt -eq 6 ] && { echo "::error::Production app health check failed after the backend update."; exit 1; }
              sleep 20
            done
          fi

          {
            echo "### Deployed"
            echo
            echo "Dev, then production, run \`sha-${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
