name: Publish Fork Backend Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fork-backend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/bl4ckbl1zz/convex-backend

jobs:
  build:
    name: Build and publish ${{ matrix.platform }} backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
            cache_scope: convex-backend-amd64
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: convex-backend-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Reclaim hosted-runner build space
        shell: bash
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read commit timestamp
        id: commit
        shell: bash
        run:
          echo "timestamp=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.commit.outputs.timestamp }}
            org.opencontainers.image.description=High-throughput self-hosted Convex backend
          build-args: |
            CARGO_BUILD_JOBS=2
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ steps.commit.outputs.timestamp }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to:
            "type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true"
          provenance: false

  publish:
    name: Publish multi-platform backend manifest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform tags
        id: manifest
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:main" \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          digest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}" |
              awk '$1 == "Digest:" { print $2; exit }'
          )"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Write pull information
        shell: bash
        run: |
          {
            echo "### Published backend image"
            echo
            echo "\`${IMAGE_NAME}:latest\`"
            echo
            echo "\`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`"
            echo
            echo "Digest: \`${{ steps.manifest.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
