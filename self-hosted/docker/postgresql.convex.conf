# PostgreSQL 17 profile for a Convex backend and PostgreSQL sharing an 8 GiB
# Docker Desktop VM. Re-size memory settings when the Docker VM changes.

# Accept connections from the private Compose network. The published host port
# remains explicitly bound to 127.0.0.1 in docker-compose.postgres.yml.
listen_addresses = '*'

# Connections: the Convex pool is capped at 64 in docker-compose.yml.
max_connections = 100
superuser_reserved_connections = 3

# Memory: PostgreSQL shares the Docker VM with the Rust backend and Node workers.
shared_buffers = '1GB'
effective_cache_size = '5GB'
work_mem = '16MB'
hash_mem_multiplier = 1.5
maintenance_work_mem = '512MB'
autovacuum_work_mem = '128MB'
temp_buffers = '16MB'

# WAL and checkpoints: absorb write bursts and spread durable writes.
wal_buffers = '-1'
min_wal_size = '1GB'
max_wal_size = '4GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
wal_compression = on

# SSD and Linux container I/O.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100

# Convex is an OLTP workload dominated by short statements.
default_statistics_target = 250
jit = off
max_worker_processes = 10
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Global fallback for new tables. Core Convex tables receive tighter reloptions
# from postgres-autovacuum.sql so triggers remain predictable as tables grow.
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = '5s'
autovacuum_vacuum_threshold = 100
autovacuum_vacuum_scale_factor = 0.01
autovacuum_vacuum_insert_threshold = 100
autovacuum_vacuum_insert_scale_factor = 0.01
autovacuum_analyze_threshold = 100
autovacuum_analyze_scale_factor = 0.005
autovacuum_vacuum_cost_limit = 4000
autovacuum_vacuum_cost_delay = '1ms'
vacuum_buffer_usage_limit = '128MB'

# Move dirty-page work away from foreground backends.
bgwriter_delay = '100ms'
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0
backend_flush_after = '1MB'

# Production-safe observability and transaction hygiene.
track_io_timing = on
track_wal_io_timing = on
log_checkpoints = on
log_autovacuum_min_duration = '1s'
log_temp_files = '64MB'
log_lock_waits = on
idle_in_transaction_session_timeout = '60s'

# These are intentionally explicit: performance testing must not weaken
# PostgreSQL's crash durability guarantees.
synchronous_commit = on
fsync = on
full_page_writes = on
