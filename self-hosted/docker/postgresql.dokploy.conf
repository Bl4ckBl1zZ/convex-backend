# PostgreSQL 17 profile for the shared 16-core / 32 GiB Dokploy host used by
# ModularBots. PostgreSQL and the Convex backend have explicit container memory
# ceilings, but these settings intentionally leave headroom for other services.

listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory. Keep work_mem bounded because it is allocated per sort/hash node, not
# per connection. Six autovacuum workers can each use autovacuum_work_mem.
shared_buffers = '2GB'
effective_cache_size = '10GB'
work_mem = '8MB'
hash_mem_multiplier = 1.5
maintenance_work_mem = '768MB'
autovacuum_work_mem = '128MB'
temp_buffers = '16MB'

# WAL and checkpoints. These absorb write bursts while preserving full crash
# durability and spreading checkpoint I/O over most of the interval.
wal_buffers = '-1'
min_wal_size = '2GB'
max_wal_size = '8GB'
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
wal_compression = on
synchronous_commit = on
fsync = on
full_page_writes = on

# NVMe/SSD planner and background I/O defaults.
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100
default_statistics_target = 250
jit = off
max_worker_processes = 12
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# Aggressive global fallback. Convex's hottest persistence tables receive even
# tighter fixed thresholds from postgres-autovacuum.sql.
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = '5s'
autovacuum_vacuum_threshold = 100
autovacuum_vacuum_scale_factor = 0.01
autovacuum_vacuum_insert_threshold = 100
autovacuum_vacuum_insert_scale_factor = 0.01
autovacuum_analyze_threshold = 100
autovacuum_analyze_scale_factor = 0.005
autovacuum_vacuum_cost_limit = 6000
autovacuum_vacuum_cost_delay = '1ms'
vacuum_buffer_usage_limit = '256MB'

bgwriter_delay = '100ms'
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0
backend_flush_after = '1MB'

# Production diagnostics with bounded log volume.
shared_preload_libraries = 'pg_stat_statements'
compute_query_id = on
track_io_timing = on
track_wal_io_timing = on
log_checkpoints = on
log_autovacuum_min_duration = '1s'
log_min_duration_statement = '5s'
log_temp_files = '64MB'
log_lock_waits = on
idle_in_transaction_session_timeout = '60s'
