services:
  backend:
    # Build the scaling fork by default. Set CONVEX_BACKEND_IMAGE to use a
    # prebuilt image, and omit --build when starting Compose in that case.
    image: ${CONVEX_BACKEND_IMAGE:-convex-backend:scale-self-hosted}
    build:
      context: ../..
      dockerfile: self-hosted/docker-build/Dockerfile.backend
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${PORT:-3210}:3210"
      - "${SITE_PROXY_PORT:-3211}:3211"
    volumes:
      - data:/convex/data
    environment:
      - V8_ACTION_USER_TIMEOUT_SECS
      - NODE_ACTION_USER_TIMEOUT_SECS
      # Hardware-aware defaults are derived inside the backend. Setting any of
      # these variables still overrides the derived value.
      - VERTICAL_SCALING_ENABLED=${VERTICAL_SCALING_ENABLED:-true}
      - VERTICAL_SCALING_CPU_COUNT=${VERTICAL_SCALING_CPU_COUNT:-0}
      - VERTICAL_SCALING_RESERVED_CPU_COUNT=${VERTICAL_SCALING_RESERVED_CPU_COUNT:-0}
      - APPLICATION_MAX_CONCURRENT_MUTATIONS
      - APPLICATION_MAX_CONCURRENT_NODE_ACTIONS
      - APPLICATION_MAX_CONCURRENT_QUERIES
      - APPLICATION_MAX_CONCURRENT_V8_ACTIONS
      - FUNRUN_ISOLATE_ACTIVE_THREADS
      - MAX_TRANSACTION_ISOLATE_WORKERS
      - MAX_ACTION_ISOLATE_WORKERS
      - MAX_ISOLATE_WORKERS
      - COMMITTER_MAX_CONCURRENT_PERSISTENCE_WRITES
      - AWS_ACCESS_KEY_ID
      - AWS_REGION
      - AWS_S3_DISABLE_CHECKSUMS
      - AWS_S3_DISABLE_SSE
      - AWS_S3_FORCE_PATH_STYLE
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:${PORT:-3210}}
      - CONVEX_RELEASE_VERSION_DEV
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:${SITE_PROXY_PORT:-3211}}
      - DATABASE_URL
      - DISABLE_BEACON
      - DISABLE_METRICS_ENDPOINT=${DISABLE_METRICS_ENDPOINT:-true} # Enable if you want prometheus compatible /metrics endpoint
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800} # Lower default document retention to 2 days
      - DO_NOT_REQUIRE_SSL
      - HTTP_SERVER_TIMEOUT_SECONDS
      - HTTP_SERVER_MAX_CONCURRENT_REQUESTS=${HTTP_SERVER_MAX_CONCURRENT_REQUESTS:-1024}
      - IN_PROCESS_SEARCH_CACHE_PATH=${IN_PROCESS_SEARCH_CACHE_PATH:-/convex/data/search-cache}
      - IN_PROCESS_SEARCH_CACHE_SIZE_BYTES=${IN_PROCESS_SEARCH_CACHE_SIZE_BYTES:-2147483648}
      - INSTANCE_NAME
      - INSTANCE_SECRET
      - LOCAL_NODE_EXECUTOR_POOL_SIZE
      - MAX_BYTES_WRITTEN_PER_SECOND=${MAX_BYTES_WRITTEN_PER_SECOND:-4194304}
      - MYSQL_URL
      - POSTGRES_URL
      # Stock PostgreSQL reserves only 100 connections. Leave room for admin
      # sessions and other services instead of using Convex's code default 128.
      - POSTGRES_MAX_CONNECTIONS=${POSTGRES_MAX_CONNECTIONS:-64}
      - REDACT_LOGS_TO_CLIENT
      - RUST_BACKTRACE
      - RUST_LOG=${RUST_LOG:-info}
      - S3_ENDPOINT_URL
      - S3_STORAGE_EXPORTS_BUCKET
      - S3_STORAGE_FILES_BUCKET
      - S3_STORAGE_MODULES_BUCKET
      - S3_STORAGE_SEARCH_BUCKET
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET
      - SEARCH_GENERAL_POOL_MAX_CONCURRENCY
      - SEARCH_GENERAL_POOL_QUEUE_SIZE
      - STORAGE_MAXIMUM_PARALLEL_UPLOADS
      - STORAGE_MAX_CONCURRENT_CHUNK_DOWNLOADS

    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    # Change this to :${REV} if you want to pin to a specific version
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:${PORT:-3210}}
      - NEXT_PUBLIC_LOAD_MONACO_INTERNALLY
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
